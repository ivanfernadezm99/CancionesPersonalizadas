# Agregar este bloque dentro del server HTTPS (puerto 443) en:
#   /etc/nginx/sites-enabled/opencode
#
# Para aplicarlo:
#   sudo cp nginx-canciones-api.conf /tmp/
#   sudo vim /etc/nginx/sites-enabled/opencode
#   sudo nginx -t && sudo systemctl reload nginx

    # Proxy para CancionesPersonalizadas API (FastAPI) — Puerto 8001
    location /canciones-api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Audio streaming: binario, sin buffering
        proxy_buffering off;
    }
